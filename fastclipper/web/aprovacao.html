<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila de aprovação · Fast Clipper</title>
<style>
  :root {
    --bg: #0F0A1E;
    --card: #18112D;
    --panel: #18112D;
    --raised: #22183D;
    --line: #3A2A5E;
    --ink: #FBF4FF;
    --text: #FBF4FF;
    --sub: #D2C4EC;
    --muted: #A495C6;
    --mute: #A495C6;
    --accent: #FF4FA3;
    --accent-hover: #FF2E8C;
    --accent-soft: rgba(255, 79, 163, 0.16);
    --accent-ink: #1B0714;
    --sunset: #FF8A3D;
    --violet: #9B5CFF;
    --violet-text: #B98CFF;
    --teal: #2EE6D6;
    --ok: #3DDC97;
    --green: #3DDC97;
    --warn: #FFB547;
    --amber: #FFB547;
    --error: #FF5D6C;
    --red: #FF5D6C;
    --pink: #FF4FA3;
    --grad-vice: linear-gradient(90deg, #FF8A3D 0%, #FF4FA3 50%, #9B5CFF 100%);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  body::before { content:""; position:fixed; top:0; left:0; right:0; height:3px; background:var(--grad-vice); z-index:1000; }
  :focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  header { position:sticky; top:0; z-index:5; background:rgba(15,10,30,.94); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); padding:14px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.2px; }
  h1 b { color:var(--sunset); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:13px; color:var(--mute); cursor:pointer; background:var(--raised); }
  .chip:hover { border-color:var(--sub); color:var(--text); }
  .chip.on { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:600; }
  .chip .n { color:inherit; font-weight:600; margin-left:4px; }
  .spacer { flex:1; }
  button.act { background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; }
  button.act:hover:not(:disabled) { background:var(--accent-hover); }
  button.act:disabled { opacity:.5; cursor:default; background:var(--raised); color:var(--mute); border:1px solid var(--line); }
  .warn { margin:14px 20px 0; padding:10px 14px; border:1px solid rgba(255,181,71,0.35); background:rgba(255,181,71,0.12); color:var(--amber); border-radius:8px; font-size:14px; }
  main { padding:20px; display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  video { width:100%; aspect-ratio:9/16; background:#000000; display:block; object-fit:contain; max-height:520px; }
  .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
  .meta { font-size:12.5px; color:var(--mute); display:flex; justify-content:space-between; gap:8px; }
  .score { color:var(--green); font-weight:600; }
  .hook { font-weight:650; font-size:15.5px; }
  textarea { width:100%; min-height:78px; resize:vertical; background:var(--raised); color:var(--text);
             border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  .plats { display:flex; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--mute); }
  .plats label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; border:0; border-radius:8px; padding:10px; font-weight:700; cursor:pointer; font-size:14px; }
  .ok { background:var(--green); color:#062015; }
  .no { background:var(--raised); color:var(--text); border:1px solid var(--line); }
  .log { font-size:12.5px; color:var(--mute); white-space:pre-wrap; word-break:break-word; }
  .empty { grid-column:1/-1; text-align:center; color:var(--mute); padding:60px 0; }
  .st { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .st.agendado { color:var(--green); } .st.falhou { color:var(--red); } .st.aprovado { color:var(--amber); }
  a { color:var(--teal); text-decoration:none; }
  a:hover { color:var(--accent); text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1><b>●</b> Fila de aprovação</h1>
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <span id="runinfo" style="font-size:13px;color:var(--mute)"></span>
  <button class="act" id="runbtn">Rodar ciclo agora</button>
  <a href="/" style="font-size:13px">Studio</a>
</header>
<div id="warns"></div>
<main id="grid"><div class="empty">Carregando…</div></main>

<script>
const STATUSES = [["pendente","Pendentes"],["agendado","Agendados"],["aprovado","Aprovados"],["falhou","Falharam"],["rejeitado","Rejeitados"]];
let current = "pendente", platforms = [];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.round(+s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function loadStatus() {
  const s = await api("/api/v1/autopilot/status");
  platforms = s.platforms || [];
  const c = s.counts || {};
  document.getElementById("chips").innerHTML = STATUSES.map(([k, l]) =>
    `<button class="chip ${k===current?"on":""}" data-s="${k}">${l}<span class="n">${c[k]||0}</span></button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { current = b.dataset.s; refresh(); });
  const w = [];
  if (!s.config_found) w.push(`Sem configuração. Copie <b>autopilot.example.json</b> para <code>${esc(s.config_path)}</code>.`);
  if (!s.buffer_ready) w.push("Buffer não configurado: aprovar só marca o clipe como pronto para você postar manualmente.");
  else if (!s.media_host_ready) w.push("Buffer configurado, mas sem armazenamento público (media_host). O Buffer precisa de uma URL pública do MP4.");
  w.push(`Pasta de entrada: <code>${esc(s.inbox_dir)}</code> (solte vídeos aqui para cortar).`);
  document.getElementById("warns").innerHTML = w.map(x => `<div class="warn">${x}</div>`).join("");
  const lr = s.last_run || {};
  document.getElementById("runbtn").disabled = !!lr.running;
  document.getElementById("runinfo").textContent = lr.running ? "Ciclo rodando…" :
    lr.error ? "Último ciclo: " + lr.error : lr.summary ? `Último ciclo: ${lr.summary.new_candidates} clipes novos` : "";
  return !!lr.running;
}

function card(c) {
  const log = c.publish_log ? JSON.stringify(c.publish_log, null, 1) : "";
  const canAct = ["pendente","aprovado","falhou"].includes(c.status);
  return `<div class="card" id="${c.candidate_id}">
    <video src="/api/v1/autopilot/video/${c.candidate_id}" controls preload="metadata" playsinline></video>
    <div class="body">
      <div class="meta"><span>${esc(c.source_name)} · ${fmt(c.inicio_s)}–${fmt(c.fim_s)}</span>
        <span class="score">${c.score != null ? (Math.round(c.score*100)) + " pts" : ""}</span></div>
      <div class="hook">${esc(c.hook)}</div>
      <div class="meta"><span>${esc(c.reason)}</span>${c.status!=="pendente"?`<span class="st ${c.status}">${c.status}</span>`:""}</div>
      ${canAct ? `<textarea>${esc(c.caption)}</textarea>
      <div class="plats">${platforms.map(p => `<label><input type="checkbox" value="${p}" checked>${p}</label>`).join("")}</div>
      <div class="row"><button class="ok">${c.status==="pendente"?"Aprovar":"Reenviar"}</button>
        <button class="no">Rejeitar</button></div>` : ""}
      ${log ? `<div class="log">${esc(log)}</div>` : ""}
    </div></div>`;
}

async function refresh() {
  const running = await loadStatus().catch(e => { console.error(e); return false; });
  const list = await api(`/api/v1/autopilot/candidates?status=${current}`).catch(() => []);
  const grid = document.getElementById("grid");
  grid.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">Nada em “${current}”.</div>`;
  list.forEach(c => {
    const el = document.getElementById(c.candidate_id);
    const ok = el.querySelector(".ok"), no = el.querySelector(".no");
    if (ok) ok.onclick = async () => {
      ok.disabled = no.disabled = true; ok.textContent = "Enviando…";
      const plats = [...el.querySelectorAll(".plats input:checked")].map(i => i.value);
      try {
        await api(`/api/v1/autopilot/candidates/${c.candidate_id}/approve`, {method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({caption: el.querySelector("textarea").value, platforms: plats})});
      } catch (e) { alert(e.message); }
      refresh();
    };
    if (no) no.onclick = async () => {
      await api(`/api/v1/autopilot/candidates/${c.candidate_id}/reject`, {method:"POST"}).catch(e => alert(e.message));
      el.remove(); loadStatus();
    };
  });
  if (running) setTimeout(refresh, 8000);
}

document.getElementById("runbtn").onclick = async () => {
  await api("/api/v1/autopilot/run-now", {method:"POST"}).catch(e => alert(e.message));
  setTimeout(refresh, 800);
};
refresh();
setInterval(() => { if (current === "pendente") loadStatus(); }, 30000);
</script>
</body>
</html>
