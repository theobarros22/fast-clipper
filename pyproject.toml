[project]
name = "fastclipper"
version = "0.3.0"
description = "Fast Clipper Studio Local — clipping vertical 9:16 com transcrição e legendas sincronizadas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
transcribe = [
    "faster-whisper>=1.1",
    "yt-dlp>=2026.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]
vision = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "mediapipe>=0.10",
]
ai = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
fastclipper = "fastclipper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fastclipper*"]
