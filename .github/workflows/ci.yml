name: Fast Clipper CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check UTF-8 & mojibake in fastclipper
        run: |
          python -c "
          from pathlib import Path
          bad = []
          for p in Path('fastclipper').rglob('*.py'):
              txt = p.read_text(encoding='utf-8')
              if 'Ã¡' in txt or 'âœ' in txt or '\ufffd' in txt:
                  bad.append(str(p))
          assert not bad, f'Encoding corrompido detectado em: {bad}'
          print('UTF-8 OK em todos os arquivos fastclipper/')
          "

      - name: Run Fast Clipper test suite
        run: pytest -m "not golden and not heavy" -v
